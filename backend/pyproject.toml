[project]
name = "gradinghelper-backend"
version = "0.2.0"
description = "GradingHelper backend (FastAPI) — see /SPECIFICATION.md for the full spec."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary - internal department tool" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.12",  # multipart form parsing for PDF uploads
    "argon2-cffi>=23.1",         # password hashing (§3)
    "pdfplumber>=0.11",          # primary registration-PDF parser (§5.2)
    "pymupdf>=1.24",             # fallback parser (§5.2)
    "typst>=0.11",               # typst-py binding, PDF report rendering (§12)
    "openpyxl>=3.1",             # .xlsx export (§10, §11)
    "alembic>=1.18.5",           # schema migrations (docs/open-questions.md #11)
]
# German (DIN 5007-1) collation for the attendance-list sort (§6) needed no new dependency —
# resolved (docs/open-questions.md #10) as a stdlib-only sort key in app/collation.py.

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",   # FastAPI test client
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

# Pinned explicitly: ruff's *default* rule set expands between releases, so relying on it makes
# `ruff check` results shift under an unrelated dependency upgrade.
[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
